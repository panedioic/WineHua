# .github/workflows/build.yml
name: Build HAP (arm64-v8a, unsigned)

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [master]
  workflow_dispatch:

# GITHUB_TOKEN 权限:
#   contents: read  — 拉源码
#   packages: read  — 拉 GHCR 私有 buildenv 镜像
permissions:
  contents: read
  packages: read

jobs:
  build:
    name: make NATIVE_ARCH=arm64-v8a hap
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    # 容器里默认 shell 是 sh, 不认 `set -o pipefail` 等 bash 语法
    # 这里强制所有 run step 用 bash
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/panedioic/winehua-buildenv:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ---- 让私有 submodule 走 HTTPS + GITHUB_TOKEN ----
      # 前提: wine/box64/mesa-ohos 三个私有 submodule 与本仓库在同一账号/组织下
      # 若跨组织, 需替换成有跨仓库权限的 PAT (存到 secrets.SUBMODULE_PAT)
      - name: Configure git for private submodules
        run: |
          git config --global --add safe.directory '*'
          git config --global \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "git@github.com:"
          git config --global --add \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- 绕过签名: 用 stub 替换 sign.py ----
      # scripts/package.sh 最后会调 `python3 sign.py <unsigned> <signed>`,
      # 无签名场景下这里直接把 unsigned 拷成 "signed" 文件, 让 make hap 完整跑完
      - name: Stub sign.py (unsigned build)
        run: |
          cat > sign.py <<'PY'
          #!/usr/bin/env python3
          # CI-only stub: 无签名构建, 直接把 unsigned HAP 拷贝为 "signed" 输出
          import shutil, sys, os
          src, dst = sys.argv[1], sys.argv[2]
          os.makedirs(os.path.dirname(dst), exist_ok=True)
          shutil.copy(src, dst)
          print(f"[sign-stub] copied {src} -> {dst} (UNSIGNED)")
          PY
          chmod +x sign.py

      - name: Show environment
        run: |
          echo "== toolchain =="
          gcc --version | head -1
          cmake --version | head -1
          meson --version
          ninja --version
          python3 --version
          java -version 2>&1 | head -1
          echo "== OHOS SDK =="
          ls /apps/harmony/sdk/default/openharmony/native/llvm/bin/clang
          /apps/harmony/bin/hvigorw --version || true
          echo "== nproc =="
          nproc

      # ==== 深度诊断: 镜像里到底装了什么 ====
      - name: Deep diagnose libltdl-dev
        run: |
          echo "===== dpkg says: ====="
          dpkg -l | grep -E 'libtool|libltdl' || true
          echo
          echo "===== files owned by libltdl-dev: ====="
          dpkg -L libltdl-dev 2>&1 | head -30 || echo "(package not installed?)"
          echo
          echo "===== /usr/share/aclocal/ contents: ====="
          ls -la /usr/share/aclocal/ | head -30
          echo
          echo "===== image digest (from container runtime): ====="
          cat /etc/os-release | grep VERSION_CODENAME || true

      # ==== 自愈: 如果 ltdl.m4 缺失, 现场装/重装 libltdl-dev ====
      - name: Ensure libtool m4 macros present
        run: |
          if [ ! -f /usr/share/aclocal/ltdl.m4 ]; then
            echo "ltdl.m4 missing, installing libltdl-dev..."
            apt-get update
            apt-get install --reinstall -y libltdl-dev
            ls -la /usr/share/aclocal/ltdl.m4
          else
            echo "ltdl.m4 present, no action needed"
          fi

      - name: Diagnose autotools/aclocal environment
        run: |
          echo "===== container identity ====="
          id
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          
          echo "===== aclocal ====="
          which aclocal
          aclocal --version | head -1
          echo "aclocal --print-ac-dir: $(aclocal --print-ac-dir)"
          
          echo "===== ACLOCAL_PATH ====="
          echo "ACLOCAL_PATH=${ACLOCAL_PATH:-<unset>}"
          
          echo "===== system m4 files ====="
          ls -la /usr/share/aclocal/ltdl.m4 /usr/share/aclocal/libtool.m4 2>&1
          
          echo "===== dirlist ====="
          _acdir=$(aclocal --print-ac-dir)
          if [ -f "$_acdir/dirlist" ]; then
              echo "== $_acdir/dirlist =="
              cat "$_acdir/dirlist"
          else
              echo "no dirlist file"
          fi
          
          echo "===== aclocal --verbose (dry run on libffi) ====="
          cd thirdparty/libffi
          # 不实际生成, 只看它搜索路径
          aclocal --verbose -I m4 --output=/tmp/test_acl.m4 2>&1 | head -40 || true
          echo
          echo "===== does /tmp/test_acl.m4 have LT_SYS_SYMBOL_USCORE? ====="
          grep -c 'LT_SYS_SYMBOL_USCORE' /tmp/test_acl.m4 2>/dev/null || echo "NOT FOUND"
          
          echo "===== env dump (aclocal/autotools related) ====="
          env | grep -iE 'ACLOCAL|AUTOMAKE|AUTOCONF|LIBTOOL|M4' || echo "(none)"

      - name: Build HAP
        env:
          NATIVE_ARCH: arm64-v8a
          BUILD_GUEST_GFX: '0'
          BUILD_WINE_MONO: '0'
        run: |
          set -euxo pipefail
          make NATIVE_ARCH=arm64-v8a hap

      - name: Locate artifacts
        id: art
        run: |
          set -eux
          out_dir=entry/build/default/outputs/default
          ls -lh "$out_dir"
          if [ -f "$out_dir/entry-default-unsigned.hap" ]; then
            echo "hap=$out_dir/entry-default-unsigned.hap" >> "$GITHUB_OUTPUT"
          else
            echo "hap=$out_dir/entry-default-signed.hap" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: WineHua-arm64-v8a-unsigned-${{ github.sha }}
          path: ${{ steps.art.outputs.hap }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/**/meson-logs/**
            build/**/CMakeFiles/CMakeOutput.log
            build/**/CMakeFiles/CMakeError.log
            build/**/config.log
          if-no-files-found: ignore
          retention-days: 7