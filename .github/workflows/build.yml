# .github/workflows/build.yml
name: Build HAP (arm64-v8a, unsigned)

on:
  push:
    branches: [master]
    tags:
      - 'v*'                    # v0.1.0, v1.2.3-rc1 等, 推 tag 会额外触发 release job
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (留空则只构建不发布)'
        required: false
        type: string

# GITHUB_TOKEN 权限:
#   contents: write — 拉源码 + 发布 Release (需要 write)
#   packages: read  — 拉 GHCR 私有 buildenv 镜像
permissions:
  contents: write
  packages: read

jobs:
  build:
    name: make NATIVE_ARCH=arm64-v8a hap
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    # 容器里默认 shell 是 sh, 不认 `set -o pipefail` 等 bash 语法
    # 这里强制所有 run step 用 bash
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/panedioic/winehua-buildenv:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      NATIVE_ARCH: arm64-v8a

    steps:
      - name: Configure git for private submodules
        run: |
          git config --global --add safe.directory '*'
          git config --global \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "git@github.com:"
          git config --global --add \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- 绕过签名: 用 stub 替换 sign.py ----
      # scripts/package.sh 最后会调 `python3 sign.py <unsigned> <signed>`,
      # 无签名场景下这里直接把 unsigned 拷成 "signed" 文件, 让 make hap 完整跑完
      - name: Stub sign.py (unsigned build)
        run: |
          cat > sign.py <<'PY'
          #!/usr/bin/env python3
          # CI-only stub: 无签名构建, 直接把 unsigned HAP 拷贝为 "signed" 输出
          import shutil, sys, os
          src, dst = sys.argv[1], sys.argv[2]
          os.makedirs(os.path.dirname(dst), exist_ok=True)
          shutil.copy(src, dst)
          print(f"[sign-stub] copied {src} -> {dst} (UNSIGNED)")
          PY
          chmod +x sign.py

      # ---- CI-only: 无签名的 build-profile.json5 ----
      # 从 example 派生会踩坑: example 里的 signingConfigs 指向占位符路径,
      # hvigor 的 SignHap 任务会校验这些文件存在, 直接失败.
      # 这里显式写一份 signingConfigs 为空的 profile, 让 hvigor 跳过 SignHap,
      # 直接输出 entry-default-unsigned.hap.
      - name: Provision unsigned build-profile.json5
        run: |
          cat > build-profile.json5 <<'JSON5'
          {
            "app": {
              "signingConfigs": [],
              "products": [
                {
                  "name": "default",
                  "targetSdkVersion": "6.1.0(23)",
                  "compatibleSdkVersion": "6.1.0(23)",
                  "runtimeOS": "HarmonyOS",
                  "buildOption": {
                    "nativeCompiler": "BiSheng",
                    "strictMode": {
                      "caseSensitiveCheck": true,
                      "useNormalizedOHMUrl": true
                    }
                  }
                }
              ],
              "buildModeSet": [
                {
                  "name": "debug"
                },
                {
                  "name": "release"
                }
              ]
            },
            "modules": [
              {
                "name": "entry",
                "srcPath": "./entry",
                "targets": [
                  {
                    "name": "default",
                    "applyToProducts": ["default"]
                  }
                ]
              }
            ]
          }
          JSON5
          echo "[ci] wrote unsigned build-profile.json5 (signingConfigs empty)"

      # ---- 兜底: 确保预构建 buildenv 含当前源码所需工具 ----
      # libltdl-dev 是 Wine 依赖; glslangValidator 是 DXVK 配置阶段生成
      # 内置 SPIR-V 的硬依赖. Dockerfile 已同步声明, 镜像更新后这里 no-op.
      - name: Ensure CI build dependencies present
        run: |
          packages=()
          if [ ! -f /usr/share/aclocal/ltdl.m4 ]; then
            packages+=(libltdl-dev)
          fi
          if ! command -v glslangValidator >/dev/null 2>&1; then
            packages+=(glslang-tools)
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            echo "Installing missing CI packages: ${packages[*]}"
            apt-get update
            apt-get install -y --no-install-recommends "${packages[@]}"
          else
            echo "CI build dependencies already present"
          fi

      # ============================================================
      # 缓存: 按 submodule sha 拉起大依赖的中间产物
      # 命中时可省去 deps / wine / box64 三个阶段的编译时间
      # ============================================================
      - name: Get submodule shas
        id: shas
        run: |
          wine_sha=$(git -C thirdparty/wine rev-parse HEAD)
          box64_sha=$(git -C thirdparty/box64 rev-parse HEAD)
          echo "wine=$wine_sha" >> "$GITHUB_OUTPUT"
          echo "box64=$box64_sha" >> "$GITHUB_OUTPUT"
          echo "Wine sha: $wine_sha"
          echo "Box64 sha: $box64_sha"

      # actions/cache@v4 在 container job 里对同一 cache 条目的多个 path
      # 只会保存其中一个 (已用 stub workflow 复现). 因此每个目录/文件
      # 独立一个 cache 条目. Key 前缀改成 v2, 与旧的坏 cache 区分.
      - name: Cache deps sysroot-ext
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/sysroot-ext
          key: deps-v2-sysroot-${{ hashFiles('scripts/build_deps.sh', 'scripts/build_freetype.sh', 'scripts/env.sh') }}

      - name: Cache deps stamp
        id: cache-deps-stamp
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/.stamps/deps
          key: deps-v2-stamp-${{ hashFiles('scripts/build_deps.sh', 'scripts/build_freetype.sh', 'scripts/env.sh') }}

      - name: Cache Wine native tools
        id: cache-wine-native
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/wine-native
          key: wine-v2-native-arm64-v8a-${{ steps.shas.outputs.wine }}-${{ hashFiles('scripts/build_wine.sh', 'scripts/env.sh') }}

      - name: Cache Wine OHOS
        id: cache-wine-ohos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/wine-ohos
          key: wine-v2-ohos-arm64-v8a-${{ steps.shas.outputs.wine }}-${{ hashFiles('scripts/build_wine.sh', 'scripts/env.sh') }}

      - name: Cache Wine server
        id: cache-wine-server
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/wine_server
          key: wine-v2-server-arm64-v8a-${{ steps.shas.outputs.wine }}-${{ hashFiles('scripts/build_wine.sh', 'scripts/env.sh') }}

      - name: Cache Wine stamp
        id: cache-wine-stamp
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/.stamps/wine-arm64-v8a
          key: wine-v2-stamp-arm64-v8a-${{ steps.shas.outputs.wine }}-${{ hashFiles('scripts/build_wine.sh', 'scripts/env.sh') }}

      - name: Cache Box64 build
        id: cache-box64
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/box64_build
          key: box64-v2-build-${{ steps.shas.outputs.box64 }}-${{ hashFiles('scripts/build_box64.sh') }}

      - name: Cache Box64 stamp
        id: cache-box64-stamp
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/.stamps/box64-arm64-v8a
          key: box64-v2-stamp-${{ steps.shas.outputs.box64 }}-${{ hashFiles('scripts/build_box64.sh') }}

      - name: Report cache hits
        run: |
          echo "deps sysroot     : ${{ steps.cache-deps.outputs.cache-hit }}"
          echo "deps stamp       : ${{ steps.cache-deps-stamp.outputs.cache-hit }}"
          echo "wine native      : ${{ steps.cache-wine-native.outputs.cache-hit }}"
          echo "wine ohos        : ${{ steps.cache-wine-ohos.outputs.cache-hit }}"
          echo "wine server      : ${{ steps.cache-wine-server.outputs.cache-hit }}"
          echo "wine stamp       : ${{ steps.cache-wine-stamp.outputs.cache-hit }}"
          echo "box64 build      : ${{ steps.cache-box64.outputs.cache-hit }}"
          echo "box64 stamp      : ${{ steps.cache-box64-stamp.outputs.cache-hit }}"

      # cache 恢复文件的 mtime 有时会用当前时间, 导致 Makefile 的
      # find -newer 误判 stamp 过期; 显式 touch 一下让 stamp 最新
      - name: Refresh stamp mtimes on cache hit
        run: |
          if [ -d build/.stamps ]; then
            find build/.stamps -type f -exec touch {} +
            echo "stamps after refresh:"
            ls -la build/.stamps/ build/.stamps/*/ 2>/dev/null || true
          fi

      - name: Show environment
        run: |
          echo "== toolchain =="
          gcc --version | head -1
          cmake --version | head -1
          meson --version
          ninja --version
          python3 --version
          glslangValidator --version | head -1
          x86_64-w64-mingw32-g++ --version | head -1
          i686-w64-mingw32-g++ --version | head -1
          java -version 2>&1 | head -1
          echo "== OHOS SDK =="
          ls /apps/harmony/sdk/default/openharmony/native/llvm/bin/clang
          /apps/harmony/bin/hvigorw --version || true
          echo "== nproc =="
          nproc

      # 分阶段构建, 每阶段结束后打点, 找出 build/ 消失的具体时机
      - name: Build stage 1 — deps + wine + box64 (cacheable)
        env:
          BUILD_GUEST_GFX: '1'
          BUILD_GUEST_VULKAN: '1'
          BUILD_WINE_MONO: '1'
        run: |
          set -euxo pipefail
          # Makefile box64 recipe cp box64.so to entry/libs/arm64-v8a/,
          # normally created by native stage; running box64 alone needs manual mkdir.
          mkdir -p entry/libs/arm64-v8a

          # Deep diagnostic: mesa keeps failing with
          #   "Program '/usr/local/bin/wayland-scanner' not found or not executable"
          # Log everything about wayland-scanner state before/around the failure.
          probe_scanner() {
            echo "==== wayland-scanner probe: $1 ===="
            echo "PATH=$PATH"
            which wayland-scanner || echo "(which failed)"
            command -v wayland-scanner || echo "(command -v failed)"
            for pth in /usr/local/bin/wayland-scanner /usr/bin/wayland-scanner \
                       "$PWD/build/host-tools/bin/wayland-scanner"; do
              if [ -e "$pth" ]; then
                ls -la "$pth"
                [ -x "$pth" ] && echo "  -> executable" || echo "  -> NOT executable"
                file "$pth" 2>/dev/null | head -1
              else
                echo "$pth -> MISSING"
              fi
            done
            echo "--- pkg-config ---"
            pkg-config --exists wayland-scanner && echo "wayland-scanner.pc: OK" || echo "wayland-scanner.pc: MISSING"
            pkg-config --variable=wayland_scanner wayland-scanner 2>&1 || true
            if [ -f "$PWD/build/sysroot-ext/usr/lib/pkgconfig/wayland-scanner.pc" ]; then
              echo "--- sysroot-ext wayland-scanner.pc ---"
              cat "$PWD/build/sysroot-ext/usr/lib/pkgconfig/wayland-scanner.pc"
            fi
            echo
          }

          probe_scanner "BEFORE make deps"
          make NATIVE_ARCH=arm64-v8a deps || {
            rc=$?
            echo
            echo "==== make deps FAILED, probing state ===="
            probe_scanner "AFTER make deps FAILURE"
            exit $rc
          }
          probe_scanner "AFTER make deps SUCCESS"
          echo "---- after deps ----"
          ls -la build/ 2>&1 | head -20
          du -sh build/sysroot-ext build/.stamps 2>/dev/null || true

          make NATIVE_ARCH=arm64-v8a wine
          echo "---- after wine ----"
          ls -la build/ 2>&1 | head -20
          du -sh build/wine-native build/wine-ohos build/wine_server build/.stamps 2>/dev/null || true

          make NATIVE_ARCH=arm64-v8a box64
          echo "---- after box64 ----"
          ls -la build/ 2>&1 | head -20
          du -sh build/box64_build build/.stamps 2>/dev/null || true

      - name: Build guest graphics runtime (x64 + x86)
        run: |
          set -euxo pipefail
          make NATIVE_ARCH=arm64-v8a dxvk
          for dll in \
            build/dxvk/legacy/x64/bin/d3d11.dll \
            build/dxvk/legacy/x64/bin/dxgi.dll \
            build/dxvk/legacy/x86/bin/d3d11.dll \
            build/dxvk/legacy/x86/bin/dxgi.dll; do
            test -s "$dll"
          done
          file build/dxvk/legacy/x64/bin/d3d11.dll \
               build/dxvk/legacy/x64/bin/dxgi.dll \
               build/dxvk/legacy/x86/bin/d3d11.dll \
               build/dxvk/legacy/x86/bin/dxgi.dll
          sha256sum build/dxvk/legacy/{x64,x86}/bin/{d3d11,dxgi}.dll

      - name: Snapshot cacheable content before assemble/hap
        run: |
          set -eux
          # 在 assemble/hap 之前先备份, 无论后面 build/ 发生什么, snapshot 保住产物
          mkdir -p build-cache-snapshot
          for src in build/sysroot-ext build/wine-native build/wine-ohos \
                     build/wine_server build/box64_build build/.stamps; do
            if [ -e "$src" ]; then
              # 用硬链接省空间; 跨设备退回 cp -a
              cp -al "$src" "build-cache-snapshot/$(basename "$src")" 2>/dev/null || \
                cp -a  "$src" "build-cache-snapshot/$(basename "$src")"
            fi
          done
          echo "---- snapshot content ----"
          ls -la build-cache-snapshot/
          du -sh build-cache-snapshot/* 2>/dev/null || true

      - name: Build stage 2 — native + assemble + hap
        env:
          BUILD_GUEST_GFX: '1'
          BUILD_GUEST_VULKAN: '1'
          BUILD_WINE_MONO: '1'
        run: |
          set -euxo pipefail
          make NATIVE_ARCH=arm64-v8a hap
          echo "---- after hap ----"
          ls -la build/ 2>&1 | head -20 || echo "(build/ missing)"

      - name: Restore snapshot for cache save
        if: always()
        run: |
          set -eux
          # 无论 build/ 是否消失, 把 snapshot 内容放回原位
          if [ -d build-cache-snapshot ]; then
            mkdir -p build build/.stamps
            for d in build-cache-snapshot/*; do
              name=$(basename "$d")
              if [ "$name" = ".stamps" ]; then
                cp -a "$d"/. build/.stamps/
              else
                # 目标可能已存在, 先清再复制
                rm -rf "build/$name"
                cp -a "$d" "build/$name"
              fi
            done
            echo "---- restored build/ ----"
            ls -la build/
            du -sh build/* 2>/dev/null | sort -h | tail -20
          fi

      # 深度诊断: 看清楚 build/ 下真实产出
      - name: Diagnose build tree
        if: always()
        run: |
          set +e
          echo "== ls -la build/ =="
          ls -la build/ 2>&1 | head -30
          echo
          echo "== du -sh build/*  =="
          du -sh build/* 2>&1 | sort -k1 -h | tail -30
          echo
          echo "== find build/.stamps -type f =="
          find build/.stamps -type f 2>&1
          echo
          echo "== 查找可能的 wine 输出目录 =="
          find build -maxdepth 2 -type d -name '*wine*' 2>&1
          echo
          echo "== 查找 sysroot =="
          find build -maxdepth 2 -type d -name '*sysroot*' 2>&1
          echo
          echo "== 查找 box64 相关 =="
          find build -maxdepth 3 -name 'box64*' 2>&1 | head -20
          exit 0

      - name: Diagnose build tree (for cache path check)
        if: always()
        run: |
          set +e
          echo "== ls -la build/ =="
          ls -la build/ 2>&1 | head -40
          echo
          echo "== du -sh build/*  (large-first) =="
          du -sh build/* 2>&1 | sort -k1 -h | tail -30
          echo
          echo "== 查找 wine/sysroot/box64 =="
          find build -maxdepth 2 -type d 2>&1 | sort
          echo
          echo "== stamps =="
          find build/.stamps -type f 2>&1 | sort
          echo
          echo "== cache path 实际存在性 =="
          for p in \
              build/sysroot-ext \
              build/wine-native \
              build/wine-ohos \
              build/wine_server \
              build/box64_build \
              build/.stamps/deps \
              build/.stamps/wine-arm64-v8a \
              build/.stamps/box64-arm64-v8a; do
            if [ -e "$p" ]; then
              size=$(du -sh "$p" 2>/dev/null | cut -f1)
              printf "OK       %-40s  %s\n" "$p" "$size"
            else
              printf "MISSING  %-40s\n" "$p"
            fi
          done
          exit 0

      # 诊断: 确认 cache 路径实际是否存在
      - name: Diagnose cache paths
        if: always()
        run: |
          set +e
          echo "== pwd == $(pwd)"
          echo "== GITHUB_WORKSPACE == ${GITHUB_WORKSPACE}"
          echo "== HOME == ${HOME}"
          echo
          echo "== ls -la . =="
          ls -la
          echo
          echo "== ls -la build/ =="
          ls -la build/ 2>&1 | head -30
          echo
          echo "== ls -la build/.stamps/ =="
          ls -la build/.stamps/ 2>&1
          echo
          echo "== 关键目录存在情况 =="
          for d in build/sysroot-ext build/wine-native build/wine-ohos build/wine_server build/box64_build; do
            if [ -d "$d" ]; then
              printf "OK      %-30s  %s\n" "$d" "$(du -sh "$d" 2>/dev/null | cut -f1)"
            else
              printf "MISSING %-30s\n" "$d"
            fi
          done
          echo
          echo "== 关键 stamp 存在情况 =="
          for s in build/.stamps/deps build/.stamps/wine-arm64-v8a build/.stamps/box64-arm64-v8a; do
            if [ -f "$s" ]; then
              printf "OK      %s\n" "$s"
            else
              printf "MISSING %s\n" "$s"
            fi
          done

      - name: Locate artifacts
        id: art
        run: |
          set -eux
          out_dir=entry/build/default/outputs/default
          ls -lh "$out_dir"
          if [ -f "$out_dir/entry-default-unsigned.hap" ]; then
            echo "hap=$out_dir/entry-default-unsigned.hap" >> "$GITHUB_OUTPUT"
          else
            echo "hap=$out_dir/entry-default-signed.hap" >> "$GITHUB_OUTPUT"
          fi

      # PE 构建成功不代表产物完整: 校验 HAP 内嵌 wine-data.zip 中的运行时
      # DLL 与 submodule 实际 commit 一致, 防止陈旧 staging 或错误架构的
      # 产物在发布前未被发现.
      - name: Verify embedded runtime in HAP
        env:
          HAP_PATH: ${{ steps.art.outputs.hap }}
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import struct
          import subprocess
          import zipfile

          hap_path = os.environ["HAP_PATH"]
          expected_commit = subprocess.check_output(
              ["git", "-C", "thirdparty/dxvk", "rev-parse", "HEAD"], text=True
          ).strip()

          with zipfile.ZipFile(hap_path) as hap:
              payload = hap.read("resources/rawfile/wine-data.zip")
              runtime_manifest = json.loads(
                  hap.read("resources/rawfile/wine-runtime-manifest.json")
              )

          payload_sha = hashlib.sha256(payload).hexdigest()
          assert runtime_manifest["payloadSha256"] == payload_sha, (
              runtime_manifest["payloadSha256"], payload_sha
          )

          required = {
              "dxvk/legacy/x64/d3d11.dll": 0x8664,
              "dxvk/legacy/x64/dxgi.dll": 0x8664,
              "dxvk/legacy/x86/d3d11.dll": 0x014C,
              "dxvk/legacy/x86/dxgi.dll": 0x014C,
          }
          with zipfile.ZipFile(io.BytesIO(payload)) as wine_data:
              dxvk_manifest = json.loads(wine_data.read("dxvk/manifest.json"))
              assert dxvk_manifest["profile"] == "legacy"
              assert dxvk_manifest["version"] == "1.10.3"
              assert dxvk_manifest["commit"] == expected_commit, (
                  dxvk_manifest["commit"], expected_commit
              )
              for name, expected_machine in required.items():
                  image = wine_data.read(name)
                  assert len(image) > 4096, (name, len(image))
                  assert image[:2] == b"MZ", name
                  pe_offset = struct.unpack_from("<I", image, 0x3C)[0]
                  assert image[pe_offset:pe_offset + 4] == b"PE\0\0", name
                  machine = struct.unpack_from("<H", image, pe_offset + 4)[0]
                  assert machine == expected_machine, (
                      name, hex(machine), hex(expected_machine)
                  )
                  print(f"[dxvk] {name}: machine={machine:#06x} size={len(image)}")

              # 仅 PE DLL 在 ARM64 HarmonyOS 上不可运行, 需同 payload 内的
              # Vulkan 依赖链文件齐全才能工作, 一并校验.
              vulkan_runtime = (
                  "bin/x86_64-windows/vulkan-1.dll",
                  "bin/i386-windows/vulkan-1.dll",
                  "bin/x86_64-unix/winevulkan.so",
                  "bin/guest_vulkan/lib/libvulkan.so.1",
                  "bin/guest_vulkan/lib/libvulkan_virtio.so",
                  "bin/guest_vulkan/share/vulkan/icd.d/venus_icd.x86_64.json",
              )
              for name in vulkan_runtime:
                  image = wine_data.read(name)
                  assert image, name
                  print(f"[vulkan] {name}: size={len(image)}")

          print(f"[dxvk] commit={expected_commit}")
          print(f"[dxvk] wine-data.zip sha256={payload_sha}")
          PY

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: WineHua-arm64-v8a-unsigned-${{ github.sha }}
          path: ${{ steps.art.outputs.hap }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/**/meson-logs/**
            build/**/CMakeFiles/CMakeOutput.log
            build/**/CMakeFiles/CMakeError.log
            build/**/config.log
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # Release job: 仅在推 tag 或手动指定 release_tag 时运行
  # ============================================================
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要历史 commit 生成 changelog

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Download HAP artifact
        uses: actions/download-artifact@v4
        with:
          name: WineHua-arm64-v8a-unsigned-${{ github.sha }}
          path: ./release-assets

      - name: Rename artifact with version
        run: |
          set -eux
          cd release-assets
          for f in *.hap; do
            mv "$f" "WineHua-${{ steps.tag.outputs.tag }}-arm64-v8a-unsigned.hap"
          done
          ls -lh

      - name: Generate changelog
        run: |
          # 找到上一个 tag (若存在)
          prev_tag=$(git describe --tags --abbrev=0 "${{ steps.tag.outputs.tag }}^" 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            {
              echo "## Changes since \`$prev_tag\`"
              echo
              git log --pretty=format:'- %s (%h)' "$prev_tag..${{ steps.tag.outputs.tag }}"
            } > changelog.md
          else
            echo "## Initial release" > changelog.md
          fi
          {
            echo
            echo
            echo "---"
            echo
            echo "**Note**: This build is **unsigned**. To install on a HarmonyOS device you'll need developer mode enabled, or sign the HAP with your own certificate first."
            echo
            echo "Built from commit \`${GITHUB_SHA:0:7}\`."
          } >> changelog.md
          echo "---- changelog.md ----"
          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: WineHua ${{ steps.tag.outputs.tag }}
          body_path: changelog.md
          files: release-assets/*.hap
          draft: false
          # -rc / -beta / -alpha 后缀自动标记为 pre-release
          prerelease: ${{ contains(steps.tag.outputs.tag, '-rc') || contains(steps.tag.outputs.tag, '-beta') || contains(steps.tag.outputs.tag, '-alpha') }}
          fail_on_unmatched_files: true
