# .github/workflows/cache-diag-stub.yml
# Stub cache 诊断 v2: 每个目录独立 cache 条目, 验证多路径 cache 是否是 bug
name: Cache Diag Stub (fake outputs)

on:
  workflow_dispatch:
    inputs:
      wine_ohos_size_mb:
        description: 'wine-ohos 大小 (MB)'
        required: false
        default: '1000'

permissions:
  contents: read
  packages: read

jobs:
  diag:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/panedioic/winehua-buildenv:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      WINE_OHOS_SIZE_MB: ${{ github.event.inputs.wine_ohos_size_mb || '1000' }}

    steps:
      - name: Configure git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show params
        run: |
          echo "WINE_OHOS_SIZE_MB=$WINE_OHOS_SIZE_MB"
          df -h .

      # ============================================================
      # 方案对比: 一个 cache 多个 path (v1, 已证明有 bug) vs 每目录单独 cache (v2)
      # ============================================================

      # v1: 一个 cache 多个 path (复现 bug)
      - name: Cache v1 — multi-path in one entry (bug reproducer)
        id: cache-v1
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build-v1/wine-native
            ${{ github.workspace }}/build-v1/wine-ohos
            ${{ github.workspace }}/build-v1/wine_server
          key: stub-v1-multipath-${{ env.WINE_OHOS_SIZE_MB }}

      # v2: 每个目录独立 cache (预期能成功)
      - name: Cache v2a — wine-native alone
        id: cache-v2a
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build-v2/wine-native
          key: stub-v2a-wine-native-${{ env.WINE_OHOS_SIZE_MB }}

      - name: Cache v2b — wine-ohos alone
        id: cache-v2b
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build-v2/wine-ohos
          key: stub-v2b-wine-ohos-${{ env.WINE_OHOS_SIZE_MB }}

      - name: Cache v2c — wine_server alone
        id: cache-v2c
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build-v2/wine_server
          key: stub-v2c-wine-server-${{ env.WINE_OHOS_SIZE_MB }}

      - name: Report hits
        run: |
          echo "v1  multi-path  : ${{ steps.cache-v1.outputs.cache-hit }}"
          echo "v2a wine-native : ${{ steps.cache-v2a.outputs.cache-hit }}"
          echo "v2b wine-ohos   : ${{ steps.cache-v2b.outputs.cache-hit }}"
          echo "v2c wine_server : ${{ steps.cache-v2c.outputs.cache-hit }}"

      # ============================================================
      # 生成两套完全相同的 stub 内容
      # ============================================================
      - name: Generate stubs (both v1 and v2 layouts)
        run: |
          set -euxo pipefail
          for root in build-v1 build-v2; do
            mkdir -p $root/wine-native $root/wine-ohos $root/wine_server
            # 同样内容, 便于事后对比 cache 大小
            dd if=/dev/urandom of=$root/wine-native/blob.bin  bs=1M count=50 status=none
            dd if=/dev/urandom of=$root/wine-ohos/blob.bin    bs=1M count=$WINE_OHOS_SIZE_MB status=none
            dd if=/dev/urandom of=$root/wine_server/blob.bin  bs=1M count=2 status=none
          done

      - name: Report actual sizes
        if: always()
        run: |
          set +e
          echo "== v1 (multi-path) =="
          du -sh build-v1/* 2>&1
          echo
          echo "== v2 (per-dir) =="
          du -sh build-v2/* 2>&1
          echo
          echo "== disk =="
          df -h .
          exit 0
