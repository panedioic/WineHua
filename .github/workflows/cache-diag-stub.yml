# .github/workflows/cache-diag-stub.yml
# Stub cache 诊断: 不跑真实构建, 用 dd 生成占位文件模拟产物
# 目的: 快速迭代 cache 保存/恢复逻辑, 单次 <2 分钟, 不用等 50 分钟真实构建
name: Cache Diag Stub (fake outputs)

on:
  workflow_dispatch:
    inputs:
      wine_size_mb:
        description: 'wine-ohos 大小 (MB)'
        required: false
        default: '1000'
      deps_size_mb:
        description: 'sysroot-ext 大小 (MB)'
        required: false
        default: '16'
      box64_size_mb:
        description: 'box64_build 大小 (MB)'
        required: false
        default: '100'

permissions:
  contents: read
  packages: read

jobs:
  diag:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/panedioic/winehua-buildenv:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      WINE_SIZE_MB: ${{ github.event.inputs.wine_size_mb || '1000' }}
      DEPS_SIZE_MB: ${{ github.event.inputs.deps_size_mb || '16' }}
      BOX64_SIZE_MB: ${{ github.event.inputs.box64_size_mb || '100' }}

    steps:
      - name: Configure git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Checkout (no submodules, fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show input params + disk space
        run: |
          echo "WINE_SIZE_MB=$WINE_SIZE_MB"
          echo "DEPS_SIZE_MB=$DEPS_SIZE_MB"
          echo "BOX64_SIZE_MB=$BOX64_SIZE_MB"
          echo
          df -h .

      # ============================================================
      # 三个 cache action - 跟主 workflow 一模一样的配置
      # ============================================================
      - name: Cache deps (sysroot-ext)
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build/sysroot-ext
            ${{ github.workspace }}/build/.stamps/deps
          key: stub-deps-v1-${{ env.DEPS_SIZE_MB }}

      - name: Cache Wine build
        id: cache-wine
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build/wine-native
            ${{ github.workspace }}/build/wine-ohos
            ${{ github.workspace }}/build/wine_server
            ${{ github.workspace }}/build/.stamps/wine-arm64-v8a
          key: stub-wine-v1-${{ env.WINE_SIZE_MB }}

      - name: Cache Box64 build
        id: cache-box64
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build/box64_build
            ${{ github.workspace }}/build/.stamps/box64-arm64-v8a
          key: stub-box64-v1-${{ env.BOX64_SIZE_MB }}

      - name: Report cache hits
        run: |
          echo "deps  hit: ${{ steps.cache-deps.outputs.cache-hit }}"
          echo "wine  hit: ${{ steps.cache-wine.outputs.cache-hit }}"
          echo "box64 hit: ${{ steps.cache-box64.outputs.cache-hit }}"

      # ============================================================
      # 生成 stub 内容, 除非 cache 已命中
      # ============================================================
      - name: Stub — generate fake outputs
        if: |
          steps.cache-deps.outputs.cache-hit != 'true' ||
          steps.cache-wine.outputs.cache-hit != 'true' ||
          steps.cache-box64.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p build/.stamps
          mkdir -p build/sysroot-ext build/wine-native build/wine-ohos build/wine_server build/box64_build

          # 用小 bs + count, 但内容随机避免压缩后过小
          echo "Generating deps stub (${DEPS_SIZE_MB} MB)..."
          dd if=/dev/urandom of=build/sysroot-ext/blob.bin bs=1M count=$DEPS_SIZE_MB status=none
          touch build/.stamps/deps

          echo "Generating wine stubs..."
          # wine-ohos 是最大的
          dd if=/dev/urandom of=build/wine-ohos/blob.bin bs=1M count=$WINE_SIZE_MB status=none
          # wine-native 相对小
          dd if=/dev/urandom of=build/wine-native/blob.bin bs=1M count=50 status=none
          # wine_server 最小
          dd if=/dev/urandom of=build/wine_server/blob.bin bs=1M count=2 status=none
          touch build/.stamps/wine-arm64-v8a

          echo "Generating box64 stub (${BOX64_SIZE_MB} MB)..."
          dd if=/dev/urandom of=build/box64_build/blob.bin bs=1M count=$BOX64_SIZE_MB status=none
          touch build/.stamps/box64-arm64-v8a

      # ============================================================
      # 打点: 报告实际大小
      # ============================================================
      - name: Report actual sizes before post-hook
        if: always()
        run: |
          set +e
          echo "== ls -la build/ =="
          ls -la build/ 2>&1
          echo
          echo "== du -sh build/* =="
          du -sh build/* 2>&1 | sort -h
          echo
          echo "== cache path 内容 =="
          for p in \
              build/sysroot-ext \
              build/wine-native \
              build/wine-ohos \
              build/wine_server \
              build/box64_build \
              build/.stamps/deps \
              build/.stamps/wine-arm64-v8a \
              build/.stamps/box64-arm64-v8a; do
            if [ -e "$p" ]; then
              size=$(du -sh "$p" 2>/dev/null | cut -f1)
              printf "OK       %-40s  %s\n" "$p" "$size"
            else
              printf "MISSING  %-40s\n" "$p"
            fi
          done
          echo
          echo "== disk usage =="
          df -h .
          exit 0

      # ============================================================
      # 校验: 如果 cache 命中, 内容 sha256 应稳定
      # ============================================================
      - name: Compute checksums (for hit path validation)
        if: always()
        run: |
          set +e
          echo "== sha256 of stubs (if exist) =="
          for f in \
              build/sysroot-ext/blob.bin \
              build/wine-ohos/blob.bin \
              build/wine-native/blob.bin \
              build/wine_server/blob.bin \
              build/box64_build/blob.bin; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || echo "?")
              sha=$(sha256sum "$f" 2>/dev/null | cut -c1-16)
              printf "%-40s size=%-12s sha=%s\n" "$f" "$size" "$sha"
            fi
          done
          exit 0
